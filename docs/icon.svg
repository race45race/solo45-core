<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Solo45 Core</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2028"/>
      <stop offset="1" stop-color="#0e1116"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- the Solo45 ring -->
  <circle cx="256" cy="232" r="150" fill="none" stroke="#f7931a" stroke-width="26"/>
  <!-- a hexagonal "core" inside the ring (Rust's gear-like nut, a mining chip) -->
  <polygon points="256,128 346,180 346,284 256,336 166,284 166,180" fill="#f7931a" opacity="0.14"/>
  <text x="256" y="270" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="124" font-weight="800" fill="#f7931a">45</text>
  <text x="256" y="452" text-anchor="middle" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="64" font-weight="700" letter-spacing="10" fill="#e8eaed">CORE</text>
</svg>
